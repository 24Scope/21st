<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de control 21st</title>
  <link rel="icon" href="img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#1b1c2c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=66">
</head>
<body>
  <!-- ====================== PANTALLA DE ACCESO ====================== -->
  <section id="pantalla-acceso" class="acceso" hidden>
    <div class="acceso-tarjeta">
      <div class="marca grande"><img class="marca-logo" src="img/logo-21.png" alt="Logo de la 21st"><span class="marca-texto" data-nombre-sitio></span></div>
      <p class="acceso-sub">Panel de gestión y registros de la legión</p>

      <div class="pestanas">
        <button class="pestana activa" data-modo="entrar">Iniciar sesión</button>
        <button class="pestana" data-modo="registrar">Registrarse</button>
      </div>

      <form id="form-acceso" autocomplete="on">
        <label class="campo" data-solo="registrar" hidden>
          <span>Nombre (como te conocen en la legión)</span>
          <input name="nombre" type="text" maxlength="60">
        </label>
        <label class="campo">
          <span>Email</span>
          <input name="email" type="email" required autocomplete="email">
        </label>
        <label class="campo">
          <span>Contraseña</span>
          <input name="pass" type="password" required minlength="6" autocomplete="current-password">
        </label>
        <p id="acceso-error" class="error" hidden></p>
        <p id="acceso-info" class="info" hidden></p>
        <button class="btn primario ancho" type="submit" id="btn-acceso">Entrar</button>
      </form>

      <p class="aviso-demo" data-demo hidden>
        <strong>Modo demo:</strong> todavía no se conectó Supabase. Las cuentas y datos se guardan solo en este navegador.
        La primera cuenta que crees será Administrador.
      </p>
    </div>
  </section>

  <!-- ====================== CUENTA PENDIENTE ====================== -->
  <section id="pantalla-espera" class="acceso" hidden>
    <div class="acceso-tarjeta espera-tarjeta">
      <div class="marca grande"><img class="marca-logo" src="img/logo-21.png" alt="Logo de la 21st"><span class="marca-texto" data-nombre-sitio></span></div>
      <div class="espera-icono" id="espera-icono">⏳</div>
      <h2 id="espera-titulo">Cuenta pendiente de aprobación</h2>
      <p class="acceso-sub" id="espera-texto"></p>
      <p class="espera-cuenta" id="espera-cuenta"></p>
      <form id="form-datos" class="form-datos" hidden>
        <label class="campo"><span>Rango in-game *</span><select name="grado" required></select></label>
        <label class="campo"><span>Nombre de clon *</span><input name="clon" required minlength="2" maxlength="60" placeholder="Como figura in-game"></label>
        <label class="campo"><span>Nombre Jedi</span><input name="jedi" maxlength="60" placeholder="Dejalo vacío si no tenés"></label>
        <label class="campo"><span>Discord ID *</span><input name="discord" required minlength="2" maxlength="41" class="mono" placeholder="Ej: agustinto" autocomplete="off">
          <small class="ayuda-campo">Tu usuario de Discord (el @ que aparece en tu perfil), sin el @. Ej: @agustinto → agustinto.</small></label>
        <p id="datos-error" class="error" hidden></p>
        <button class="btn primario ancho" id="btn-datos">Enviar mis datos</button>
      </form>
      <div class="decl-resumen" id="decl-resumen" hidden></div>
      <div class="espera-botones">
        <button class="btn" id="btn-espera-corregir" hidden>Corregir mis datos</button>
        <button class="btn primario" id="btn-espera-comprobar">Comprobar de nuevo</button>
        <button class="btn" id="btn-espera-salir">Cerrar sesión</button>
      </div>
    </div>
  </section>

  <!-- ====================== APLICACIÓN ====================== -->
  <div id="app" class="app" hidden>
    <aside class="lateral" id="lateral">
      <div class="marca"><img class="marca-logo" src="img/logo-21.png" alt="Logo de la 21st"><span class="marca-texto" data-nombre-sitio></span></div>
      <nav id="menu" class="menu"></nav>
      <div class="lateral-pie">
        <div class="usuario">
          <div class="avatar" id="usuario-avatar"></div>
          <div class="usuario-datos">
            <div class="usuario-nombre" id="usuario-nombre"></div>
            <div class="usuario-rango" id="usuario-rango"></div>
          </div>
          <button class="btn-salir" id="btn-salir" title="Cerrar sesión" aria-label="Cerrar sesión">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="cortina" id="cortina"></div>

    <main class="principal">
      <header class="barra-superior">
        <button class="btn-icono solo-movil" id="btn-menu" aria-label="Abrir menú">☰</button>
        <h1 id="titulo-seccion"></h1>
        <button class="chip chip-ordenar" id="btn-ordenar" hidden title="Modo orden: arrastrá los nombres para cambiar el orden dentro de cada rango">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 9l1.5-3L6 9M3 15l1.5 3L6 15"/></svg>
          <span>Ordenar</span></button>
        <span class="chip demo" data-demo hidden>Modo demo</span>
        <span class="chip" id="chip-permiso"></span>
      </header>
      <div id="contenido" class="contenido"></div>
    </main>
  </div>

  <div id="modal-fondo" class="modal-fondo" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <header><h2 id="modal-titulo"></h2><button class="btn-icono" id="modal-cerrar" aria-label="Cerrar">✕</button></header>
      <div id="modal-cuerpo"></div>
    </div>
  </div>
  <div id="avisos" class="avisos"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=66"></script>
  <script src="js/api.js?v=66"></script>
  <script src="js/app.js?v=66"></script>
</body>
</html>
